name: SloppyClient

options:
  bundleIdPrefix: team.sloppy
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
    visionOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
  SloppyClient:
    path: .
  SloppyComputerControl:
    path: ../Packages/SloppyComputerControl
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.0.0"

targets:
  SloppyDesktopCompanion:
    type: application
    productName: Sloppy Desktop Companion
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/SloppyDesktopCompanion
        excludes: [Resources]
      - path: Sources/SloppyDesktopCompanion/Resources
        type: folder
        buildPhase: resources
    dependencies:
      - package: SloppyClient
        product: SloppyClientCore
      - package: SloppyComputerControl
        product: SloppyComputerControl
      - package: Sparkle
        product: Sparkle
    info:
      path: SupportingFiles/DesktopCompanion/Info.plist
      properties:
        CFBundleDisplayName: Sloppy Desktop Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        SUAllowsAutomaticUpdates: true
        SUAutomaticallyUpdate: false
        SUEnableAutomaticChecks: true
        SUEnableSystemProfiling: false
        SUFeedURL: $(COMPANION_UPDATE_FEED_URL)
        SUPublicEDKey: $(COMPANION_UPDATE_PUBLIC_KEY)
        SUVerifyUpdateBeforeExtraction: true
        NSMicrophoneUsageDescription: Sloppy Desktop Companion records voice requests when you choose voice input.
        NSSpeechRecognitionUsageDescription: Sloppy Desktop Companion transcribes your voice requests.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: SupportingFiles/DesktopCompanion/SloppyDesktopCompanion.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.desktop-companion
        PRODUCT_NAME: Sloppy Desktop Companion
        ENABLE_HARDENED_RUNTIME: YES
        COMPANION_UPDATE_FEED_URL: https://github.com/TeamSloppy/Sloppy/releases/latest/download/companion-appcast.xml
        COMPANION_UPDATE_PUBLIC_KEY: /HaP1yvSO8EUYuKzJi43d+Wf/lr5Re/ZMoRFIz4SAus=

  SloppyClient-macOS:
    type: application
    productName: Sloppy
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SloppyClient
      - Assets.xcassets
      - sloppy.icon
    dependencies:
      - package: SloppyClient
        product: SloppyClientCore
      - package: SloppyClient
        product: SloppyClientUI
      - package: SloppyClient
        product: SloppyFeatureOverview
      - package: SloppyClient
        product: SloppyFeatureProjects
      - package: SloppyClient
        product: SloppyFeatureAgents
      - package: SloppyClient
        product: SloppyFeatureSettings
      - package: SloppyClient
        product: SloppyFeatureSites
      - package: SloppyComputerControl
        product: SloppyComputerControl
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
        product: Sparkle
    info:
      path: SupportingFiles/macOS/Info.plist
      properties:
        CFBundleDisplayName: Sloppy
        CFBundleIdentifier: team.sloppy.client
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUAllowsAutomaticUpdates: false
        SUAutomaticallyUpdate: false
        SUEnableAutomaticChecks: true
        SUEnableSystemProfiling: false
        SUFeedURL: $(SLOPPY_UPDATE_FEED_URL)
        SUPublicEDKey: $(SLOPPY_UPDATE_PUBLIC_KEY)
        SUVerifyUpdateBeforeExtraction: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: Sloppy discovers Sloppy Core on your Wi-Fi and connects over the local network.
        NSMicrophoneUsageDescription: Sloppy uses the microphone to record audio for voice input.
        NSSpeechRecognitionUsageDescription: Sloppy uses Speech Recognition to transcribe voice input when local fallback is needed.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: team.sloppy.client
            CFBundleURLSchemes:
              - sloppy
    entitlements:
      path: SupportingFiles/macOS/SloppyClient.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Sloppy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.client
        ASSETCATALOG_COMPILER_APPICON_NAME: sloppy
        SLOPPY_UPDATE_FEED_URL: https://github.com/TeamSloppy/Sloppy/releases/latest/download/appcast.xml
        SLOPPY_UPDATE_PUBLIC_KEY: /HaP1yvSO8EUYuKzJi43d+Wf/lr5Re/ZMoRFIz4SAus=

  SloppyClient-TestFlight:
    type: application
    productName: Sloppy
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SloppyClient
      - Assets.xcassets
      - sloppy.icon
    dependencies:
      - package: SloppyClient
        product: SloppyClientCore
      - package: SloppyClient
        product: SloppyClientUI
      - package: SloppyClient
        product: SloppyFeatureOverview
      - package: SloppyClient
        product: SloppyFeatureProjects
      - package: SloppyClient
        product: SloppyFeatureAgents
      - package: SloppyClient
        product: SloppyFeatureSettings
      - package: SloppyClient
        product: SloppyFeatureSites
      - package: SloppyComputerControl
        product: SloppyComputerControl
      - package: SwiftTerm
        product: SwiftTerm
    info:
      path: SupportingFiles/macOS/TestFlight-Info.plist
      properties:
        CFBundleDisplayName: Sloppy
        CFBundleIdentifier: team.sloppy.client
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: Sloppy discovers Sloppy Core on your Wi-Fi and connects over the local network.
        NSMicrophoneUsageDescription: Sloppy uses the microphone to record audio for voice input.
        NSSpeechRecognitionUsageDescription: Sloppy uses Speech Recognition to transcribe voice input when local fallback is needed.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: team.sloppy.client
            CFBundleURLSchemes:
              - sloppy
    entitlements:
      path: SupportingFiles/macOS/SloppyClient-TestFlight.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Sloppy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: ""
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.client
        ASSETCATALOG_COMPILER_APPICON_NAME: sloppy

  SloppyClient-iOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SloppyClient
      - Assets.xcassets
      - sloppy.icon
    dependencies:
      - package: SloppyClient
        product: SloppyClientCore
      - package: SloppyClient
        product: SloppyClientUI
      - package: SloppyClient
        product: SloppyFeatureOverview
      - package: SloppyClient
        product: SloppyFeatureProjects
      - package: SloppyClient
        product: SloppyFeatureAgents
      - package: SloppyClient
        product: SloppyFeatureSettings
      - package: SloppyClient
        product: SloppyFeatureSites
      - package: SloppyClient
        product: SloppyLiveActivity
      - target: SloppyLiveActivityExtension
        embed: true
    info:
      path: SupportingFiles/iOS/Info.plist
      properties:
        CFBundleDisplayName: Sloppy
        CFBundleIdentifier: team.sloppy.client
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: team.sloppy.client
            CFBundleURLSchemes:
              - sloppy
        NSLocalNetworkUsageDescription: Sloppy discovers Sloppy Core on your Wi-Fi and connects over the local network.
        NSCameraUsageDescription: Sloppy scans one-time QR codes from your Sloppy Dashboard to connect this device securely.
        NSMicrophoneUsageDescription: Sloppy uses the microphone to record audio for voice input.
        NSSpeechRecognitionUsageDescription: Sloppy uses Speech Recognition to transcribe voice input when local fallback is needed.
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: SupportingFiles/iOS/SloppyClient-iOS.entitlements
      properties:
        com.apple.security.app-sandbox: false
        aps-environment: development
    settings:
      base:
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.client
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: sloppy

  SloppyClient-iPadOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SloppyClient
      - Assets.xcassets
      - sloppy.icon
    dependencies:
      - package: SloppyClient
        product: SloppyClientCore
      - package: SloppyClient
        product: SloppyClientUI
      - package: SloppyClient
        product: SloppyFeatureOverview
      - package: SloppyClient
        product: SloppyFeatureProjects
      - package: SloppyClient
        product: SloppyFeatureAgents
      - package: SloppyClient
        product: SloppyFeatureSettings
      - package: SloppyClient
        product: SloppyFeatureSites
      - package: SloppyClient
        product: SloppyLiveActivity
      - target: SloppyLiveActivityExtension
        embed: true
    info:
      path: SupportingFiles/iOS/Info.plist
      properties:
        CFBundleDisplayName: Sloppy
        CFBundleIdentifier: team.sloppy.client
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: team.sloppy.client
            CFBundleURLSchemes:
              - sloppy
        NSLocalNetworkUsageDescription: Sloppy discovers Sloppy Core on your Wi-Fi and connects over the local network.
        NSCameraUsageDescription: Sloppy scans one-time QR codes from your Sloppy Dashboard to connect this device securely.
        NSMicrophoneUsageDescription: Sloppy uses the microphone to record audio for voice input.
        NSSpeechRecognitionUsageDescription: Sloppy uses Speech Recognition to transcribe voice input when local fallback is needed.
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: SupportingFiles/iOS/SloppyClient-iPadOS.entitlements
      properties:
        com.apple.security.app-sandbox: false
        aps-environment: development
    settings:
      base:
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.client
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: sloppy

  SloppyLiveActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SloppyLiveActivityWidget
    dependencies:
      - package: SloppyClient
        product: SloppyLiveActivity
    info:
      path: SupportingFiles/LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Sloppy Activity
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.client.live-activity
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  SloppyClient-visionOS:
    type: application
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SloppyClient
      - Assets.xcassets
      - sloppy.icon
    dependencies:
      - package: SloppyClient
        product: SloppyClientCore
      - package: SloppyClient
        product: SloppyClientUI
      - package: SloppyClient
        product: SloppyFeatureOverview
      - package: SloppyClient
        product: SloppyFeatureProjects
      - package: SloppyClient
        product: SloppyFeatureAgents
      - package: SloppyClient
        product: SloppyFeatureSettings
      - package: SloppyClient
        product: SloppyFeatureSites
    info:
      path: SupportingFiles/visionOS/Info.plist
      properties:
        CFBundleDisplayName: Sloppy
        CFBundleIdentifier: team.sloppy.client
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: team.sloppy.client
            CFBundleURLSchemes:
              - sloppy
        NSLocalNetworkUsageDescription: Sloppy discovers Sloppy Core on your Wi-Fi and connects over the local network.
        NSMicrophoneUsageDescription: Sloppy uses the microphone to record audio for voice input.
        NSSpeechRecognitionUsageDescription: Sloppy uses Speech Recognition to transcribe voice input when local fallback is needed.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: SupportingFiles/visionOS/SloppyClient-visionOS.entitlements
      properties:
        com.apple.security.app-sandbox: false
        aps-environment: development
    settings:
      base:
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.client
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-visionOS

  SloppyClient-watchOS:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SloppyClientWatch
      - sloppy.icon
    info:
      path: SupportingFiles/watchOS/Info.plist
      properties:
        CFBundleDisplayName: Sloppy
        CFBundleIdentifier: team.sloppy.client.watchkitapp
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKSupportsAlwaysOnDisplay: true
    settings:
      base:
        DEVELOPMENT_TEAM: 8PYCRS3EA3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: team.sloppy.client.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-visionOS

schemes:
  SloppyDesktopCompanion:
    build:
      targets:
        SloppyDesktopCompanion: all
    run:
      config: Debug
      executable: SloppyDesktopCompanion
    archive:
      config: Release

  SloppyLiveActivityExtension:
    build:
      targets:
        SloppyLiveActivityExtension: all
    analyze:
      config: Debug
    archive:
      config: Release

  SloppyClient-macOS:
    build:
      targets:
        SloppyClient-macOS: all
    run:
      config: Release
      executable: SloppyClient-macOS
    profile:
      config: Release
      executable: SloppyClient-macOS
    analyze:
      config: Debug
    archive:
      config: Release

  SloppyClient-watchOS:
    build:
      targets:
        SloppyClient-watchOS: all
    run:
      config: Debug
      executable: SloppyClient-watchOS
    profile:
      config: Release
      executable: SloppyClient-watchOS
    analyze:
      config: Debug
    archive:
      config: Release

  SloppyClient-TestFlight:
    build:
      targets:
        SloppyClient-TestFlight: all
    archive:
      config: Release
