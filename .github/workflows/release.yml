name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild
        required: true
        type: string
        default: v2.3.0
      build_platform:
        description: Build all platforms or retry Linux or Apple apps
        type: choice
        default: all
        options:
          - all
          - linux
          - apps
      publish_release:
        description: Publish publicly after successful builds and the v2 approval gate
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}-${{ inputs.build_platform || 'all' }}
  cancel-in-progress: false

env:
  SWIFT_VERSION: "6.2.1"
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate:
    name: Validate Release Request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prepare_release: ${{ steps.mode.outputs.prepare_release }}
    steps:
      - name: Validate tag and publication mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "A version tag such as v2.3.0 is required." >&2
            exit 1
          fi
          PREPARE_RELEASE=true
          if [ "$PUBLISH_RELEASE" != "true" ]; then
            if IS_DRAFT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
              if [ "$IS_DRAFT" != "true" ]; then
                echo "Existing public release: build artifacts without changing its publication state."
                PREPARE_RELEASE=false
              fi
            else
              echo "Release status unavailable: build artifacts without changing publication state."
              PREPARE_RELEASE=false
            fi
          fi
          echo "prepare_release=$PREPARE_RELEASE" >> "$GITHUB_OUTPUT"

  signing-check:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_platform != 'linux' }}
    name: Verify Sparkle Signing Secret
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify signing key presence and encoding
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import os
          import sys
          value = os.environ.get("SPARKLE_PRIVATE_KEY", "").strip()
          if not value:
              sys.exit("SPARKLE_PRIVATE_KEY is missing or empty; restore the repository signing secret.")
          try:
              key = base64.b64decode(value, validate=True)
          except ValueError:
              sys.exit("SPARKLE_PRIVATE_KEY must be a base64-encoded Sparkle signing key.")
          if len(key) not in (32, 64):
              sys.exit("SPARKLE_PRIVATE_KEY has an unsupported key size.")
          print("Sparkle signing secret is present and has a valid encoding.")
          PYTHON

  build-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_platform != 'apps' }}
    needs: validate
    name: Build (Linux)
    runs-on: ubuntu-24.04
    container:
      image: swift:6.2.4-noble@sha256:9bea530093ffff8cf6c259991715ee843fe4d0f932e612f7f4b79cca6e00db87
    defaults:
      run:
        shell: bash
    env:
      # Pin the Linux patch toolchain independently of the working macOS/Windows builds.
      SWIFT_VERSION: "6.2.4"
      ADAENGINE_HEADLESS: "1"
      ADAENGINE_DISABLE_SWAN: "1"

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Swift Version
        run: swift --version

      - name: Verify Linux Observation Runtime
        run: |
          set -euo pipefail
          PROBE_DIR=$(mktemp -d)
          trap 'rm -rf "$PROBE_DIR"' EXIT
          cat > "$PROBE_DIR/probe.swift" <<'SWIFT'
          import Observation
          @Observable final class Probe { var value = 0 }
          let probe = Probe()
          withObservationTracking { _ = probe.value } onChange: {}
          probe.value = 1
          print("Observation runtime linked and ran successfully.")
          SWIFT
          swiftc -O "$PROBE_DIR/probe.swift" -o "$PROBE_DIR/probe"
          "$PROBE_DIR/probe"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev

      - name: Extract Version from Tag
        id: meta
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Inject Version into sloppy-version.json
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          sed -i "s/__SLOPPY_APP_VERSION__/$VERSION/g" Sources/sloppy/Resources/sloppy-version.json

      - name: Inject Version into Dashboard package.json
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" Dashboard/package.json

      - name: Resolve Swift Packages
        run: swift package resolve

      - name: Run Test Suite
        # Temporarily disabled.
        if: ${{ false }}
        timeout-minutes: 25
        run: |
          # Swift Testing's parallel console recorder can deadlock under heavy log output.
          swift test --no-parallel --xunit-output swift-test-results.xml > swift-test.log 2>&1 || {
            status=$?
            tail -n 1000 swift-test.log
            exit "$status"
          }
          tail -n 120 swift-test.log

      - name: Upload Swift Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-swift-test-linux-logs
          path: |
            swift-test.log
            swift-test-results.xml
          if-no-files-found: ignore

      - name: Build Release Binary
        run: swift build -c release --product sloppy

      - name: Build Dashboard
        working-directory: Dashboard
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm install
          npm run build

      - name: Package Tarball
        id: pack
        run: |
          set -euo pipefail
          BIN_PATH="$(swift build --show-bin-path -c release)"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/bin" "$STAGE/share/sloppy/dashboard" "$STAGE/share/sloppy/licenses"
          cp "$BIN_PATH/sloppy" "$STAGE/bin/"
          cp -R Dashboard/dist "$STAGE/share/sloppy/dashboard/"
          cp Dashboard/config.json "$STAGE/share/sloppy/dashboard/"
          cp Sources/sloppy/Resources/sloppy-version.json "$STAGE/share/sloppy/sloppy-version.json"
          cp -R Sources/SloppyRuntime/Resources/Prompts "$STAGE/share/sloppy/Prompts"
          cp -R Sources/sloppy/Resources/Skills "$STAGE/share/sloppy/Skills"
          cp LICENSE "$STAGE/share/sloppy/licenses/AGPL-3.0.txt"
          cp LICENSES/MIT.txt "$STAGE/share/sloppy/licenses/MIT.txt"
          cp LICENSES/README.md "$STAGE/share/sloppy/licenses/LICENSE-MAP.md"
          cp SOURCE_OFFER.md THIRD_PARTY_NOTICES.md "$STAGE/share/sloppy/licenses/"
          bash scripts/collect-third-party-licenses.sh "$STAGE/share/sloppy/licenses/third-party"
          OUT="Sloppy-linux-x86_64.tar.gz"
          tar -C "$STAGE" -czvf "${{ runner.temp }}/$OUT" bin share
          echo "tarball_path=${{ runner.temp }}/$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: ${{ steps.pack.outputs.tarball_path }}

  build-macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_platform == 'all' }}
    needs: validate
    name: Build (macOS)
    # Swift 6.2.1 cannot import Xcode 26 WebKit interfaces on macos-latest.
    runs-on: macos-15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Extract Version from Tag
        id: meta
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Inject Version into sloppy-version.json
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          sed -i '' "s/__SLOPPY_APP_VERSION__/$VERSION/g" Sources/sloppy/Resources/sloppy-version.json

      - name: Inject Version into Dashboard package.json
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" Dashboard/package.json

      - name: Resolve Swift Packages
        run: swift package resolve

      - name: Run macOS Smoke Tests
        # Temporarily disabled.
        if: ${{ false }}
        timeout-minutes: 20
        run: |
          # Linux runs the full suite; macOS covers Darwin/AppKit-sensitive paths.
          swift test --no-parallel \
            --filter "SloppyTUIThemeTests|DashboardTerminalTests|DesktopNotificationTests|CoreMainTests" \
            --xunit-output swift-test-results.xml > swift-test.log 2>&1 || {
            status=$?
            tail -n 1000 swift-test.log
            exit "$status"
          }
          tail -n 120 swift-test.log

      - name: Upload Swift Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-swift-test-macos-logs
          path: |
            swift-test.log
            swift-test-results.xml
          if-no-files-found: ignore

      - name: Build Release Binaries
        run: |
          swift build -c release --product sloppy
          swift build -c release --product SloppyNode

      - name: Build Dashboard
        working-directory: Dashboard
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm install
          npm run build

      - name: Package Tarball
        id: pack
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64) ASSET_ARCH="arm64" ;;
            x86_64) ASSET_ARCH="x86_64" ;;
            *) echo "Unsupported macOS arch: $ARCH"; exit 1 ;;
          esac
          BIN_PATH="$(swift build --show-bin-path -c release)"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/bin" "$STAGE/share/sloppy/dashboard" "$STAGE/share/sloppy/licenses"
          cp "$BIN_PATH/sloppy" "$STAGE/bin/"
          cp -R Dashboard/dist "$STAGE/share/sloppy/dashboard/"
          cp Dashboard/config.json "$STAGE/share/sloppy/dashboard/"
          cp Sources/sloppy/Resources/sloppy-version.json "$STAGE/share/sloppy/sloppy-version.json"
          cp -R Sources/SloppyRuntime/Resources/Prompts "$STAGE/share/sloppy/Prompts"
          cp -R Sources/sloppy/Resources/Skills "$STAGE/share/sloppy/Skills"
          cp LICENSE "$STAGE/share/sloppy/licenses/AGPL-3.0.txt"
          cp LICENSES/MIT.txt "$STAGE/share/sloppy/licenses/MIT.txt"
          cp LICENSES/README.md "$STAGE/share/sloppy/licenses/LICENSE-MAP.md"
          cp SOURCE_OFFER.md THIRD_PARTY_NOTICES.md "$STAGE/share/sloppy/licenses/"
          bash scripts/collect-third-party-licenses.sh "$STAGE/share/sloppy/licenses/third-party"
          OUT="Sloppy-macos-${ASSET_ARCH}.tar.gz"
          tar -C "$STAGE" -czvf "${{ runner.temp }}/$OUT" bin share
          NODE_STAGE="$(mktemp -d)"
          mkdir -p "$NODE_STAGE/bin" "$NODE_STAGE/share/sloppy/licenses"
          cp "$BIN_PATH/SloppyNode" "$NODE_STAGE/bin/sloppy-node"
          cp -R "$STAGE/share/sloppy/licenses/." "$NODE_STAGE/share/sloppy/licenses/"
          NODE_OUT="SloppyNode-macos-${ASSET_ARCH}.tar.gz"
          tar -C "$NODE_STAGE" -czvf "${{ runner.temp }}/$NODE_OUT" bin share
          echo "tarball_path=${{ runner.temp }}/$OUT" >> "$GITHUB_OUTPUT"
          echo "node_tarball_path=${{ runner.temp }}/$NODE_OUT" >> "$GITHUB_OUTPUT"
          echo "asset_name=$OUT" >> "$GITHUB_OUTPUT"
          echo "node_asset_name=$NODE_OUT" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-tarball
          path: |
            ${{ steps.pack.outputs.tarball_path }}
            ${{ steps.pack.outputs.node_tarball_path }}

  build-macos-client:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_platform != 'linux' }}
    needs: [validate, signing-check]
    name: Build Sloppy Client (macOS)
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Checkout current release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Extract Version from Tag
        id: meta
        run: |
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build macOS Installer
        id: installer
        run: |
          INSTALLER_PATH="$(ClientNative/script/build_macos_installer.sh "${{ steps.meta.outputs.version }}" "${{ runner.temp }}" | tail -1)"
          test -f "$INSTALLER_PATH"
          echo "installer_path=$INSTALLER_PATH" >> "$GITHUB_OUTPUT"

      - name: Package and Sign Sparkle Update
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY repository secret is required" >&2
            exit 1
          fi
          APP_PATH="$PWD/ClientNative/.build/installer-derived-data/Build/Products/Release/Sloppy.app"
          ARCHIVE_PATH="$(ClientNative/script/package_sparkle_archive.sh "$APP_PATH" "${{ steps.meta.outputs.version }}" "${{ runner.temp }}")"
          PRIVATE_KEY_FILE="${{ runner.temp }}/sparkle-private-key"
          trap 'rm -f "$PRIVATE_KEY_FILE"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$PRIVATE_KEY_FILE"
          chmod 600 "$PRIVATE_KEY_FILE"
          export SPARKLE_TOOLS_DIR="$PWD/ClientNative/.build/installer-derived-data/SourcePackages/artifacts/sparkle/Sparkle/bin"
          export SPARKLE_PRIVATE_KEY_FILE="$PRIVATE_KEY_FILE"
          APPCAST_PATH="$(.release-tooling/ClientNative/script/generate_sparkle_appcast.sh "$ARCHIVE_PATH" "${{ steps.meta.outputs.version }}" "${{ runner.temp }}/sparkle")"
          cp "$APPCAST_PATH" "${{ runner.temp }}/appcast.xml"
          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
          echo "appcast_path=${{ runner.temp }}/appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-client
          path: |
            ${{ steps.installer.outputs.installer_path }}
            ${{ steps.sparkle.outputs.archive_path }}
            ${{ steps.sparkle.outputs.appcast_path }}

  build-macos-companion:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_platform != 'linux' }}
    needs: [validate, signing-check]
    name: Build Desktop Companion (macOS)
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Checkout current release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
      - name: Install build tools
        run: |
          brew install xcodegen
          npm install -g xcodebuildmcp@2.3.2
      - name: Test Companion
        working-directory: ClientNative
        run: swift test --filter SloppyDesktopCompanionTests
      - name: Extract Version from Tag
        id: meta
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build universal Companion archive
        id: package
        run: |
          ARCHIVE_PATH="$(ClientNative/script/build_desktop_companion_release.sh "${{ steps.meta.outputs.version }}" "${{ runner.temp }}" | tail -1)"
          test -f "$ARCHIVE_PATH"
          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
      - name: Sign Companion appcast
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY repository secret is required" >&2
            exit 1
          fi
          PRIVATE_KEY_FILE="${{ runner.temp }}/companion-sparkle-private-key"
          trap 'rm -f "$PRIVATE_KEY_FILE"' EXIT
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$PRIVATE_KEY_FILE"
          export SPARKLE_PRIVATE_KEY_FILE="$PRIVATE_KEY_FILE"
          export SPARKLE_TOOLS_DIR="$PWD/ClientNative/.build/companion-release-derived-data/SourcePackages/artifacts/sparkle/Sparkle/bin"
          export SPARKLE_APPCAST_FILENAME=companion-appcast.xml
          APPCAST_PATH="$(.release-tooling/ClientNative/script/generate_sparkle_appcast.sh "${{ steps.package.outputs.archive_path }}" "${{ steps.meta.outputs.version }}" "${{ runner.temp }}/companion-sparkle")"
          cp "$APPCAST_PATH" "${{ runner.temp }}/companion-appcast.xml"
          echo "appcast_path=${{ runner.temp }}/companion-appcast.xml" >> "$GITHUB_OUTPUT"
      - name: Upload Companion release artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-companion
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.appcast.outputs.appcast_path }}
          if-no-files-found: error

  build-windows-node:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_platform == 'all' }}
    needs: validate
    name: Build SloppyNode (Windows)
    runs-on: windows-latest
    env:
      ADAENGINE_HEADLESS: "1"
      ADAENGINE_DISABLE_SWAN: "1"

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Resolve Swift Packages
        run: swift package resolve

      - name: Build SloppyNode
        run: swift build -c release --product SloppyNode

      - name: Package SloppyNode
        id: pack
        shell: pwsh
        run: |
          $binPath = swift build --show-bin-path -c release
          $stage = Join-Path $env:RUNNER_TEMP "sloppy-node-stage"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "bin") | Out-Null
          $licenseRoot = Join-Path $stage "share/sloppy/licenses"
          $thirdPartyRoot = Join-Path $licenseRoot "third-party"
          New-Item -ItemType Directory -Force -Path $thirdPartyRoot | Out-Null
          $exe = Join-Path $env:RUNNER_TEMP "SloppyNode-windows-x86_64.exe"
          Copy-Item (Join-Path $binPath "SloppyNode.exe") $exe
          Copy-Item $exe (Join-Path $stage "bin/sloppy-node.exe")
          Copy-Item "LICENSE" (Join-Path $licenseRoot "AGPL-3.0.txt")
          Copy-Item "LICENSES/MIT.txt" (Join-Path $licenseRoot "MIT.txt")
          Copy-Item "LICENSES/README.md" (Join-Path $licenseRoot "LICENSE-MAP.md")
          Copy-Item "SOURCE_OFFER.md" $licenseRoot
          Copy-Item "THIRD_PARTY_NOTICES.md" $licenseRoot
          Get-ChildItem ".build/checkouts" -Directory | ForEach-Object {
            $dependencyDestination = Join-Path $thirdPartyRoot $_.Name
            Get-ChildItem $_.FullName -Recurse -File |
              Where-Object { $_.Name -match '^(LICENSE|COPYING|NOTICE)(\\..*)?$' } |
              ForEach-Object {
                New-Item -ItemType Directory -Force -Path $dependencyDestination | Out-Null
                Copy-Item $_.FullName (Join-Path $dependencyDestination $_.Name) -Force
              }
          }
          $out = Join-Path $env:RUNNER_TEMP "SloppyNode-windows-x86_64.zip"
          Compress-Archive -Force -Path (Join-Path $stage "bin"), (Join-Path $stage "share") -DestinationPath $out
          "exe_path=$exe" >> $env:GITHUB_OUTPUT
          "zip_path=$out" >> $env:GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-node
          path: |
            ${{ steps.pack.outputs.exe_path }}
            ${{ steps.pack.outputs.zip_path }}

  publish:
    name: Publish Release
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_platform == 'all') && needs.validate.outputs.prepare_release == 'true' }}
    needs:
      - validate
      - build-linux
      - build-macos
      - build-macos-client
      - build-macos-companion
      - build-windows-node
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      linux_sha256: ${{ steps.assets.outputs.linux_sha256 }}
      macos_sha256: ${{ steps.assets.outputs.macos_sha256 }}
      macos_asset: ${{ steps.assets.outputs.macos_asset }}
      node_macos_sha256: ${{ steps.assets.outputs.node_macos_sha256 }}
      node_macos_asset: ${{ steps.assets.outputs.node_macos_asset }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify Sloppy v2 legal release gate
        if: ${{ !startsWith(env.RELEASE_TAG, 'v1.') && (github.event_name != 'workflow_dispatch' || inputs.publish_release) }}
        env:
          SLOPPY_V2_LEGAL_APPROVED: ${{ vars.SLOPPY_V2_LEGAL_APPROVED }}
        run: |
          if [ "$SLOPPY_V2_LEGAL_APPROVED" != "true" ]; then
            echo "v2+ release blocked: archive contributor consent and counsel approval, then set SLOPPY_V2_LEGAL_APPROVED=true."
            exit 1
          fi

      - name: Extract Version from Tag
        id: meta
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -qiE 'alpha|beta|rc|preview|pre'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-tarball
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-tarball
          path: release-assets

      - name: Download macOS Client Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-client
          path: release-assets

      - name: Download macOS Companion Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-companion
          path: release-assets

      - name: Download Windows SloppyNode Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-node
          path: release-assets

      - name: Write sloppy-version.json and SHA256SUMS
        id: assets
        working-directory: release-assets
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          cat > sloppy-version.json <<EOF
          {
            "sloppy-core": {
              "version": "$VERSION"
            }
          }
          EOF
          LINUX=$(ls Sloppy-linux-x86_64.tar.gz)
          MACOS=$(ls Sloppy-macos-*.tar.gz | head -1)
          NODE_MACOS=$(ls SloppyNode-macos-*.tar.gz | head -1)
          NODE_WINDOWS_EXE=$(ls SloppyNode-windows-x86_64.exe)
          NODE_WINDOWS=$(ls SloppyNode-windows-x86_64.zip)
          MACOS_INSTALLER=$(ls SloppyClient-macos-*.pkg | head -1)
          MACOS_CLIENT_UPDATE=$(ls SloppyClient-macos-*.zip | head -1)
          MACOS_COMPANION_UPDATE=$(ls SloppyDesktopCompanion-macos-*.zip | head -1)
          LINUX_SHA=$(sha256sum "$LINUX" | awk '{print $1}')
          MACOS_SHA=$(sha256sum "$MACOS" | awk '{print $1}')
          NODE_MACOS_SHA=$(sha256sum "$NODE_MACOS" | awk '{print $1}')
          sha256sum sloppy-version.json "$LINUX" "$MACOS" "$NODE_MACOS" "$MACOS_INSTALLER" "$MACOS_CLIENT_UPDATE" "$MACOS_COMPANION_UPDATE" appcast.xml companion-appcast.xml "$NODE_WINDOWS_EXE" "$NODE_WINDOWS" > SHA256SUMS.txt
          {
            echo "linux_sha256=$LINUX_SHA"
            echo "macos_sha256=$MACOS_SHA"
            echo "macos_asset=$MACOS"
            echo "node_macos_sha256=$NODE_MACOS_SHA"
            echo "node_macos_asset=$NODE_MACOS"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Sloppy ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_release }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            release-assets/SHA256SUMS.txt
            release-assets/sloppy-version.json
            release-assets/Sloppy-linux-x86_64.tar.gz
            release-assets/Sloppy-macos-*.tar.gz
            release-assets/SloppyNode-macos-*.tar.gz
            release-assets/SloppyClient-macos-*.pkg
            release-assets/SloppyClient-macos-*.zip
            release-assets/appcast.xml
            release-assets/SloppyDesktopCompanion-macos-*.zip
            release-assets/companion-appcast.xml
            release-assets/SloppyNode-windows-x86_64.exe
            release-assets/SloppyNode-windows-x86_64.zip

  bump-homebrew:
    name: Bump Homebrew Tap Files
    needs: publish
    if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.publish_release) }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Casks/sloppy.rb and Formula/sloppy.rb
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          LINUX_SHA256: ${{ needs.publish.outputs.linux_sha256 }}
          MACOS_SHA256: ${{ needs.publish.outputs.macos_sha256 }}
          MACOS_ASSET: ${{ needs.publish.outputs.macos_asset }}
          NODE_MACOS_SHA256: ${{ needs.publish.outputs.node_macos_sha256 }}
          NODE_MACOS_ASSET: ${{ needs.publish.outputs.node_macos_asset }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p Casks Formula
          TAG="v${VERSION}"
          MACOS_URL="https://github.com/${REPO}/releases/download/${TAG}/${MACOS_ASSET}"
          LINUX_URL="https://github.com/${REPO}/releases/download/${TAG}/Sloppy-linux-x86_64.tar.gz"
          export VERSION LINUX_SHA256 MACOS_SHA256 MACOS_URL LINUX_URL REPO
          NODE_MACOS_URL="https://github.com/${REPO}/releases/download/${TAG}/${NODE_MACOS_ASSET}"
          export NODE_MACOS_SHA256 NODE_MACOS_URL
          python3 <<'PY'
          import os
          v = os.environ["VERSION"]
          linux_sha = os.environ["LINUX_SHA256"]
          macos_sha = os.environ["MACOS_SHA256"]
          macos_url = os.environ["MACOS_URL"]
          node_macos_sha = os.environ["NODE_MACOS_SHA256"]
          node_macos_url = os.environ["NODE_MACOS_URL"]
          linux_url = os.environ["LINUX_URL"]
          repo = os.environ["REPO"]
          cask_lines = [
              'cask "sloppy" do',
              f'  version "{v}"',
              f'  sha256 "{macos_sha}"',
              "",
              f'  url "{macos_url}"',
              '  name "Sloppy"',
              '  desc "Agent runtime and dashboard for Sloppy"',
              f'  homepage "https://github.com/{repo}"',
              "",
              '  binary "bin/sloppy"',
              "",
              '  artifact "share/sloppy/dashboard", target: "#{Dir.home}/.local/share/sloppy/dashboard"',
              "end",
          ]
          node_cask_lines = [
              'cask "sloppy-node" do',
              f'  version "{v}"',
              f'  sha256 "{node_macos_sha}"',
              "",
              f'  url "{node_macos_url}"',
              '  name "SloppyNode"',
              '  desc "Local computer-control executor for Sloppy"',
              f'  homepage "https://github.com/{repo}"',
              "",
              '  binary "bin/sloppy-node"',
              "end",
          ]
          formula_lines = [
              "class Sloppy < Formula",
              '  desc "Agent runtime and dashboard for Sloppy"',
              f'  homepage "https://github.com/{repo}"',
              f'  version "{v}"',
              f'  url "{linux_url}"',
              f'  sha256 "{linux_sha}"',
              '  license "MIT"',
              "",
              "  def install",
              '    bin.install "bin/sloppy" => "sloppy"',
              '    (share/"sloppy").install Dir["share/sloppy/*"]',
              "  end",
              "",
              "  test do",
              '    system "#{bin}/sloppy", "--version"',
              "  end",
              "end",
          ]
          os.makedirs("Casks", exist_ok=True)
          os.makedirs("Formula", exist_ok=True)
          with open("Casks/sloppy.rb", "w", encoding="utf-8") as f:
              f.write("\n".join(cask_lines) + "\n")
          with open("Casks/sloppy-node.rb", "w", encoding="utf-8") as f:
              f.write("\n".join(node_cask_lines) + "\n")
          with open("Formula/sloppy.rb", "w", encoding="utf-8") as f:
              f.write("\n".join(formula_lines) + "\n")
          PY

      - name: Commit and Push
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          git add Casks/sloppy.rb Casks/sloppy-node.rb Formula/sloppy.rb
          if git diff --staged --quiet; then
            echo "No Homebrew file changes."
            exit 0
          fi
          git commit -m "chore(release): bump Homebrew cask and formula to v${VERSION}"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "${{ github.event.repository.default_branch }}"
